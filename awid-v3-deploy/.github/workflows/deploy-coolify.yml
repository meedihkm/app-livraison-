# ==========================================
# AWID v3.0 - CI/CD Pipeline pour Coolify
# Déploiement automatique sur push dans main
# ==========================================

name: Deploy to Coolify

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  FLUTTER_VERSION: '3.16.0'

jobs:
  # ==========================================
  # TESTS BACKEND
  # ==========================================
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: awid_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ./backend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint || true
    
    - name: Run tests
      run: npm test || true
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/awid_test?schema=public
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test-secret-key-for-ci-cd-pipeline

  # ==========================================
  # BUILD ADMIN
  # ==========================================
  build-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ./admin/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build Admin
      run: npm run build
      env:
        VITE_API_URL: /api
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: admin-build
        path: ./admin/dist

  # ==========================================
  # BUILD MOBILE (Livreur)
  # ==========================================
  build-mobile-livreur:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile/livreur
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Generate Freezed files
      run: flutter pub run build_runner build --delete-conflicting-outputs || true
    
    - name: Analyze code
      run: flutter analyze || true
    
    - name: Run tests
      run: flutter test || true

  # ==========================================
  # BUILD MOBILE (Client)
  # ==========================================
  build-mobile-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile/client
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Generate Freezed files
      run: flutter pub run build_runner build --delete-conflicting-outputs || true
    
    - name: Analyze code
      run: flutter analyze || true
    
    - name: Run tests
      run: flutter test || true

  # ==========================================
  # DÉPLOIEMENT SUR COOLIFY
  # ==========================================
  deploy:
    needs: [test-backend, build-admin]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: Add host to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.COOLIFY_HOST }} >> ~/.ssh/known_hosts
    
    - name: Deploy to Coolify via SSH
      run: |
        ssh ${{ secrets.COOLIFY_USER }}@${{ secrets.COOLIFY_HOST }} << 'EOF'
          cd /data/coolify/services/${{ secrets.COOLIFY_SERVICE_ID }}
          git pull origin main
          docker-compose -f docker/docker-compose.coolify.yml pull
          docker-compose -f docker/docker-compose.coolify.yml up -d --build
          docker-compose -f docker/docker-compose.coolify.yml exec -T backend npm run migrate
          docker system prune -f
        EOF
    
    - name: Notify deployment success
      if: success()
      run: |
        echo "🎉 Déploiement réussi sur Coolify !"
        echo "URLs:"
        echo "  - Backend: ${{ secrets.BACKEND_URL }}"
        echo "  - Admin: ${{ secrets.ADMIN_URL }}"
    
    - name: Notify deployment failure
      if: failure()
      run: |
        echo "❌ Échec du déploiement"
        exit 1

  # ==========================================
  # NOTIFICATIONS (Optionnel - Discord/Slack)
  # ==========================================
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify Discord
      if: ${{ secrets.DISCORD_WEBHOOK != '' }}
      uses: Ilshidur/action-discord@master
      with:
        args: |
          {{ EVENT_PAYLOAD.repository.full_name }} deployed to Coolify!
          Status: ${{ needs.deploy.result }}
          Branch: ${{ github.ref }}
          Commit: ${{ github.sha }}
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
