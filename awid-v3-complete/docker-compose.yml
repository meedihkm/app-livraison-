# ═══════════════════════════════════════════════════════════════════════════════
# AWID v3.0 - DOCKER COMPOSE PRODUCTION
# Configuration complète pour déploiement
# ═══════════════════════════════════════════════════════════════════════════════

version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # BASE DE DONNÉES
  # ═══════════════════════════════════════════════════════════════════════════
  
  postgres:
    image: postgres:16-alpine
    container_name: awid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-awid}
      POSTGRES_USER: ${POSTGRES_USER:-awid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Postgres password required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-awid} -d ${POSTGRES_DB:-awid}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - awid-network

  # ═══════════════════════════════════════════════════════════════════════════
  # CACHE & MESSAGE QUEUE
  # ═══════════════════════════════════════════════════════════════════════════
  
  redis:
    image: redis:7-alpine
    container_name: awid-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Redis password required}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - awid-network

  # ═══════════════════════════════════════════════════════════════════════════
  # API BACKEND
  # ═══════════════════════════════════════════════════════════════════════════
  
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: awid-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-awid}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-awid}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      
      # App
      API_URL: ${API_URL:-https://api.awid.dz}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://admin.awid.dz,https://app.awid.dz}
      
      # Notifications
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-AWID}
      
      # Storage
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_PATH: /app/storage
      
    volumes:
      - api_storage:/app/storage
      - api_logs:/app/logs
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - awid-network

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKER (Jobs en arrière-plan)
  # ═══════════════════════════════════════════════════════════════════════════
  
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: awid-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-awid}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-awid}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
    volumes:
      - api_storage:/app/storage
      - worker_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - awid-network

  # ═══════════════════════════════════════════════════════════════════════════
  # ADMIN WEB (React)
  # ═══════════════════════════════════════════════════════════════════════════
  
  admin-web:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_URL:-https://api.awid.dz}
        VITE_WS_URL: ${WS_URL:-wss://api.awid.dz}
    container_name: awid-admin-web
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - awid-network

  # ═══════════════════════════════════════════════════════════════════════════
  # REVERSE PROXY (Caddy - HTTPS automatique)
  # ═══════════════════════════════════════════════════════════════════════════
  
  caddy:
    image: caddy:2-alpine
    container_name: awid-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - admin-web
    networks:
      - awid-network

# ═══════════════════════════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════════════════════════

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_storage:
    driver: local
  api_logs:
    driver: local
  worker_logs:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# ═══════════════════════════════════════════════════════════════════════════════
# RÉSEAUX
# ═══════════════════════════════════════════════════════════════════════════════

networks:
  awid-network:
    driver: bridge
