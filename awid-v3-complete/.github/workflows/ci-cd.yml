# ═══════════════════════════════════════════════════════════════════════════════
# AWID v3.0 - GITHUB ACTIONS CI/CD
# Pipeline de build, test et déploiement
# ═══════════════════════════════════════════════════════════════════════════════

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  FLUTTER_VERSION: '3.16.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # BACKEND - Tests et Build
  # ═══════════════════════════════════════════════════════════════════════════
  backend-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: awid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run linting
        working-directory: backend
        run: npm run lint

      - name: Run type checking
        working-directory: backend
        run: npm run typecheck

      - name: Run tests
        working-directory: backend
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/awid_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
          NODE_ENV: test

      - name: Build
        working-directory: backend
        run: npm run build

  # ═══════════════════════════════════════════════════════════════════════════
  # ADMIN - Tests et Build
  # ═══════════════════════════════════════════════════════════════════════════
  admin-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Run linting
        working-directory: admin
        run: npm run lint

      - name: Run type checking
        working-directory: admin
        run: npm run typecheck

      - name: Build
        working-directory: admin
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: admin/dist

  # ═══════════════════════════════════════════════════════════════════════════
  # MOBILE APPS - Build Flutter
  # ═══════════════════════════════════════════════════════════════════════════
  mobile-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [livreur, client, admin]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: mobile/${{ matrix.app }}
        run: flutter pub get

      - name: Analyze code
        working-directory: mobile/${{ matrix.app }}
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile/${{ matrix.app }}
        run: flutter test

      - name: Build APK (Android)
        working-directory: mobile/${{ matrix.app }}
        run: flutter build apk --release
        if: github.ref == 'refs/heads/main'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: mobile/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
        if: github.ref == 'refs/heads/main'

  # ═══════════════════════════════════════════════════════════════════════════
  # DOCKER - Build et Push Images
  # ═══════════════════════════════════════════════════════════════════════════
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, admin-build]
    if: github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Build Backend Image
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Download Admin build artifact
      - name: Download Admin build
        uses: actions/download-artifact@v4
        with:
          name: admin-build
          path: admin/dist

      # Build Admin Image
      - name: Build and push Admin
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile.nginx
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-admin:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════════
  # DEPLOY - Staging
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/awid
            docker compose pull
            docker compose up -d
            docker system prune -f

      - name: Health check
        run: |
          sleep 30
          curl --fail ${{ vars.STAGING_URL }}/api/health || exit 1

  # ═══════════════════════════════════════════════════════════════════════════
  # DEPLOY - Production
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-production:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/awid
            
            # Backup database before deployment
            ./scripts/db.sh backup
            
            # Pull new images
            docker compose pull
            
            # Rolling update
            docker compose up -d --no-deps --scale backend=2
            sleep 30
            docker compose up -d --no-deps --scale backend=1
            
            # Cleanup
            docker system prune -f

      - name: Health check
        run: |
          sleep 30
          curl --fail ${{ vars.PROD_URL }}/api/health || exit 1

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'AWID v3.0 deployed to production!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()

  # ═══════════════════════════════════════════════════════════════════════════
  # SECURITY - Scan de vulnérabilités
  # ═══════════════════════════════════════════════════════════════════════════
  security-scan:
    runs-on: ubuntu-latest
    needs: [backend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
